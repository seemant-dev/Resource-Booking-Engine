name: Backend CI

on:
  push:
  pull_request:

jobs:
  backend:
    name: Backend compile and tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: SlotEngine-Server

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Make Maven wrapper executable
        run: chmod +x mvnw

      - name: Compile backend
        run: ./mvnw -B compile

      - name: Run backend tests
        run: JWT_SECRET="$(openssl rand -hex 32)" ./mvnw -B test

      - name: Package backend jar
        run: ./mvnw -B package -DskipTests
