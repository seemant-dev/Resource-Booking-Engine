name: Backend CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Backend compile and tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: SlotEngine-Server

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Make Maven wrapper executable
        run: chmod +x mvnw

      - name: Compile backend
        run: ./mvnw -B compile

      - name: Run backend tests
        run: JWT_SECRET="$(openssl rand -hex 32)" ./mvnw -B test

      - name: Package backend jar
        run: ./mvnw -B package -DskipTests

  container-smoke:
    name: Backend image smoke test
    runs-on: ubuntu-latest
    needs: backend
    timeout-minutes: 15

    env:
      API_IMAGE: slotengine-api:${{ github.sha }}
      COMPOSE_PROJECT_NAME: slotengine-smoke-${{ github.run_id }}-${{ github.run_attempt }}
      COOKIE_SECURE: "false"
      FRONTEND_ORIGIN: http://localhost:3000

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate temporary smoke-test secrets
        shell: bash
        run: |
          db_password="$(openssl rand -hex 24)"
          jwt_secret="$(openssl rand -hex 32)"
          echo "::add-mask::$db_password"
          echo "::add-mask::$jwt_secret"
          echo "DB_PASSWORD=$db_password" >> "$GITHUB_ENV"
          echo "JWT_SECRET=$jwt_secret" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: ./SlotEngine-Server
          load: true
          push: false
          tags: ${{ env.API_IMAGE }}
          cache-from: type=gha,scope=slotengine-backend
          cache-to: type=gha,mode=max,scope=slotengine-backend

      - name: Start PostgreSQL and backend image
        run: docker compose up --detach --no-build --wait --wait-timeout 120

      - name: Run backend smoke journey
        run: bash SlotEngine-Server/scripts/smoke-test.sh

      - name: Print container diagnostics on failure
        if: failure()
        run: |
          docker compose ps
          docker compose logs --no-color

      - name: Remove smoke-test containers and data
        if: always()
        run: docker compose down --volumes --remove-orphans
