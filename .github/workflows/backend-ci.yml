name: Backend CI

on:
  push:
  pull_request:

jobs:
  backend:
    name: Backend compile and tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: resource_booking_db
          POSTGRES_USER: resource_user
          POSTGRES_PASSWORD: resource_password
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U resource_user -d resource_booking_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: SlotEngine-Server

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Make Maven wrapper executable
        run: chmod +x mvnw

      - name: Compile backend
        run: ./mvnw -B compile

      - name: Run backend tests
        run: ./mvnw -B test

      - name: Package backend jar
        run: ./mvnw -B package -DskipTests