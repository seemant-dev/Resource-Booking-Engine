x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-resource_booking_db}
      POSTGRES_USER: ${DB_USERNAME:-resource_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in the root .env file}
    ports:
      - "127.0.0.1:${DB_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    cpus: "1.0"
    mem_limit: 1g
    shm_size: 256m
    stop_grace_period: 30s
    logging: *default-logging
    networks:
      - backend

  api:
    image: ${API_IMAGE:-slotengine-api:local}
    build:
      context: ./SlotEngine-Server
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:postgresql://postgres:5432/${DB_NAME:-resource_booking_db}
      DB_USERNAME: ${DB_USERNAME:-resource_user}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in the root .env file}
      DB_POOL_MAX_SIZE: "${DB_POOL_MAX_SIZE:-10}"
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in the root .env file}
      COOKIE_SECURE: "${COOKIE_SECURE:-true}"
      COOKIE_SAME_SITE: Lax
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:3000}
      JAVA_TOOL_OPTIONS: >-
        -Duser.timezone=UTC
        -XX:MaxRAMPercentage=65.0
        -XX:+ExitOnOutOfMemoryError
    ports:
      - "127.0.0.1:${API_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "--output", "/dev/null", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    cpus: "1.0"
    mem_limit: 768m
    pids_limit: 200
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    stop_grace_period: 30s
    logging: *default-logging
    networks:
      - backend

volumes:
  postgres_data:

networks:
  backend:
    driver: bridge
