spring.application.name=server
logging.pattern.level=trace_id=%mdc{trace_id} span_id=%mdc{span_id} trace_flags=%mdc{trace_flags} %5p

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/resource_booking_db}
spring.datasource.username=${DB_USERNAME:resource_user}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

booking.locking-strategy=pessimistic
app.timezone=Asia/Kolkata

app.security.jwt.secret=${JWT_SECRET}
app.security.jwt.access-token-expiration-minutes=15
app.security.refresh-token.expiration-days=7
app.security.cookie.secure=false
app.security.cookie.same-site=Lax
app.security.cookie.access-token-name=access_token
app.security.cookie.refresh-token-name=refresh_token
app.security.cookie.access-token-path=/
app.security.cookie.refresh-token-path=/api/auth
